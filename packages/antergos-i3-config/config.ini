[colors]
background = #20252B
background-alt = #2A3038
foreground = #E3E2E6
primary = #4A9EFF
secondary = #00D4FF
warning = #FFB86C
alert = #FF5555
disabled = #676E7D

[bar/main]
width = 100%
height = 24pt
radius = 6
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2pt
border-size = 0pt
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = "FiraCode Nerd Font:size=10;2"
font-1 = "Noto Color Emoji:size=12;2"
modules-left = i3
modules-center = date
modules-right = filesystem memory cpu pulseaudio network battery

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = true
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = #20252B
label-focused-padding = 2
label-unfocused = %index%
label-visible = %index%
label-visible-background = ${colors.background-alt}
label-visible-padding = 2
label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-separator = " "

[module/date]
type = internal/date
interval = 5
date = %H:%M
date-alt = %a %Y-%m-%d
label = %date%
label-foreground = ${colors.primary}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
warn-percentage = 90
label-mounted = DSK %percentage_used%%
label-mounted-foreground = ${colors.foreground}
label-warn = DSK %percentage_used%%!
label-warn-foreground = ${colors.alert}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
label-muted-foreground = ${colors.disabled}
label-muted = MUTED
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = VOL
ramp-volume-1 = VOL
ramp-volume-2 = VOL
click-right = pavucontrol &

[module/network]
type = internal/network
interface-type = wireless
interval = 3.0
format-connected = <label-connected>
label-connected = WIFI
label-connected-foreground = ${colors.foreground}
format-disconnected = <label-disconnected>
label-disconnected = OFF
label-disconnected-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 85
poll-interval = 30
format-charging = CHR %percentage%%
format-charging-foreground = ${colors.secondary}
format-discharging = BAT %percentage%%
label-full = FULL
format-low = LOW %percentage%%
label-low-foreground = ${colors.alert}
low-at = 15

[settings]
screenchange-reload = true
