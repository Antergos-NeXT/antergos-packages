corner-radius = 8;
round-borders = 1;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'i3bar'",
  "class_g = 'Rofi'"
];

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

active-opacity = 1.0;
inactive-opacity = 0.92;
frame-opacity = 0.9;
inactive-opacity-override = false;

opacity-rule = [
  "100:window_type = 'dock'",
  "100:class_g = 'Rofi'",
  "95:class_g  = 'kitty'",
  "95:class_g  = 'Alacritty'"
];

blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-frame = false;
blur-kern = "3x3box";

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
vsync = true;

wintypes = {
  dock = { shadow = false; fade = false; opacity = 1.0; blur-background = false; };
  tooltip = { shadow = false; fade = true; opacity = 0.95; };
  notification = { shadow = false; fade = true; opacity = 1.0; };
};
