---
mode: required
method: netinstall-add
labels:
    step: "Display Manager"
default: SDDM
items:
    - id: SDDM
      name: "SDDM"
      description: "QML-based display manager (KDE default)"
      screenshot: "sddm-screenshot.png"
      netinstall:
        name: "SDDM"
        selected: true
        critical: false
        packages:
          - sddm
          - sddm-dinit
          - pixie-sddm-git
    - id: LightDM
      name: "LightDM"
      description: "Cross-desktop display manager (GTK)"
      screenshot: "lightdm-screenshot.png"
      netinstall:
        name: "LightDM"
        selected: true
        critical: false
        packages:
          - lightdm
          - lightdm-dinit
          - lightdm-slick-greeter
          - antergos-lightdm-config
    - id: LXDM
      name: "LXDM"
      description: "Lightweight display manager (LXDE)"
      screenshot: "lxdm-screenshot.png"
      netinstall:
        name: "LXDM"
        selected: true
        critical: false
        packages:
          - lxdm
          - lxdm-dinit
    - id: greetd
      name: "greetd"
      description: "Minimal display manager (recommended for COSMIC)"
      screenshot: "greetd-screenshot.png"
      netinstall:
        name: "greetd"
        selected: true
        critical: false
        packages:
          - greetd
          - greetd-dinit
    - id: LY
      name: "LY"
      description: "Minimal TUI display manager"
      screenshot: "ly-screenshot.png"
      netinstall:
        name: "LY"
        selected: true
        critical: false
        packages:
          - ly
          - ly-dinit
